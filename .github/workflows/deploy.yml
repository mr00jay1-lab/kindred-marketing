name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Guard — assetlinks.json must be present, valid JSON, and correct
        run: |
          f=dist/.well-known/assetlinks.json
          test -f "$f" || { echo "::error::$f is missing from the build"; exit 1; }
          node -e '
            const fs = require("fs");
            const PKG = "com.kindredhome.app";
            const raw = fs.readFileSync(process.argv[1], "utf8");
            if (raw.charCodeAt(0) === 0xFEFF) { console.error("::error::assetlinks.json has a UTF-8 BOM — Google will reject it"); process.exit(1); }
            let d; try { d = JSON.parse(raw); } catch (e) { console.error("::error::assetlinks.json is not valid JSON: " + e.message); process.exit(1); }
            const stmt = (Array.isArray(d) ? d : []).find(s => s?.target?.package_name === PKG);
            if (!stmt) { console.error("::error::no Digital Asset Links statement for " + PKG); process.exit(1); }
            const fps = stmt.target.sha256_cert_fingerprints || [];
            const ok = fps.some(x => /^[0-9A-Fa-f:]+$/.test(x) && x.replace(/:/g, "").length === 64);
            if (!ok) { console.error("::error::no valid 64-hex SHA-256 fingerprint for " + PKG); process.exit(1); }
            console.log("assetlinks.json OK: " + PKG + ", " + fps.length + " fingerprint(s)");
          ' "$f"
      - name: Guard — CNAME must pin the apex (this repo owns kindredhome.app)
        run: |
          c=dist/CNAME
          test -f "$c" || { echo "::error::$c is missing — without it GitHub Pages can drop the custom domain and the apex falls back to another host with no /.well-known/assetlinks.json"; exit 1; }
          got=$(tr -d '[:space:]' < "$c")
          test "$got" = "kindredhome.app" || { echo "::error::CNAME is '$got', expected kindredhome.app"; exit 1; }
          echo "CNAME OK: $got"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
